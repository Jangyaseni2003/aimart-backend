name: aimart

services:
  # ---------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_USER}",
          "-p",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI - login with RABBITMQ_USER/RABBITMQ_PASSWORD from your root .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Application services
  # Each service's real config (DB URLs, secrets, inter-service URLs) lives
  # in its own gitignored <SERVICE>/.env file - see <SERVICE>/.env.example
  # for what's required.
  # ---------------------------------------------------------------------
  auth:
    build: ./AUTH
    restart: unless-stopped
    env_file: ./AUTH/.env
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  product:
    build: ./PRODUCT
    restart: unless-stopped
    env_file: ./PRODUCT/.env
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cart:
    build: ./CART
    restart: unless-stopped
    env_file: ./CART/.env
    ports:
      - "3002:3002"
    depends_on:
      mongo:
        condition: service_healthy

  order:
    build: ./ORDER
    restart: unless-stopped
    env_file: ./ORDER/.env
    ports:
      - "3003:3003"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      cart:
        condition: service_started
      product:
        condition: service_started

  payment:
    build: ./PAYMENT
    restart: unless-stopped
    env_file: ./PAYMENT/.env
    ports:
      - "3004:3004"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      order:
        condition: service_started

  ai-buddy:
    build: ./AI-BUDDY
    restart: unless-stopped
    env_file: ./AI-BUDDY/.env
    ports:
      - "3005:3005"
    depends_on:
      product:
        condition: service_started
      cart:
        condition: service_started

  notification:
    build: ./NOTIFICATION
    restart: unless-stopped
    env_file: ./NOTIFICATION/.env
    ports:
      - "3006:3006"
    depends_on:
      rabbitmq:
        condition: service_healthy

  seller-dashboard:
    build: ./SELLER-DASHBOARD
    restart: unless-stopped
    env_file: ./SELLER-DASHBOARD/.env
    ports:
      - "3007:3007"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build: ./GATEWAY
    restart: unless-stopped
    env_file: ./GATEWAY/.env
    ports:
      - "8000:8000"
    depends_on:
      auth:
        condition: service_started
      product:
        condition: service_started
      cart:
        condition: service_started
      order:
        condition: service_started
      payment:
        condition: service_started
      ai-buddy:
        condition: service_started
      seller-dashboard:
        condition: service_started

volumes:
  mongo-data:
