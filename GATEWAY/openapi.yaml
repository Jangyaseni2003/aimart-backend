openapi: 3.0.3
info:
  title: AIMART API
  description: >
    Consolidated API reference for the AIMART microservices platform, served
    through the API Gateway. All routes below are proxied to their respective
    backend services (Auth, Product, Cart, Order, Payment, Seller Dashboard).
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local gateway (via Docker Compose)

tags:
  - name: Auth
  - name: Products
  - name: Pricing
  - name: Reviews
  - name: Wishlist
  - name: Cart
  - name: Orders
  - name: Payments
  - name: Seller Dashboard

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        _id: { type: string }
        username: { type: string }
        email: { type: string }
        fullName:
          type: object
          properties:
            firstName: { type: string }
            lastName: { type: string }
        role: { type: string, enum: [user, seller, admin] }
        profilePic: { type: string }
        wishlist:
          type: array
          items: { type: string }
        addresses:
          type: array
          items: { $ref: "#/components/schemas/Address" }
    Address:
      type: object
      properties:
        _id: { type: string }
        street: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        country: { type: string }
    Product:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string }
        price: { type: number }
        dynamicPrice: { type: number }
        competitorPrice: { type: number }
        demand:
          type: object
          properties:
            views: { type: number }
            cartAdds: { type: number }
            purchases: { type: number }
        stock: { type: number }
        category: { type: string }
        images:
          type: array
          items: { type: string }
        avgRating: { type: number }
        reviewCount: { type: number }
        seller: { type: string }
    PriceHistoryEntry:
      type: object
      properties:
        _id: { type: string }
        product: { type: string }
        price: { type: number }
        reason: { type: string }
        demandSnapshot:
          type: object
          properties:
            views: { type: number }
            cartAdds: { type: number }
            purchases: { type: number }
        createdAt: { type: string, format: date-time }
    Review:
      type: object
      properties:
        _id: { type: string }
        product: { type: string }
        user: { type: string }
        username: { type: string }
        rating: { type: number, minimum: 1, maximum: 5 }
        comment: { type: string }
    CartItem:
      type: object
      properties:
        _id: { type: string }
        product: { type: string }
        quantity: { type: number }
    Order:
      type: object
      properties:
        _id: { type: string }
        user: { type: string }
        items:
          type: array
          items: { type: object }
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]
        shippingAddress: { $ref: "#/components/schemas/Address" }
        totalAmount: { type: number }
    Error:
      type: object
      properties:
        message: { type: string }

security:
  - bearerAuth: []

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password, fullName]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
                fullName:
                  type: object
                  properties:
                    firstName: { type: string }
                    lastName: { type: string }
                role: { type: string, enum: [user, seller] }
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: "#/components/schemas/User" }
                  token: { type: string }
        "400":
          description: Validation error or duplicate username/email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email: { type: string }
                username: { type: string }
                password: { type: string }
      responses:
        "201":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: "#/components/schemas/User" }
                  token: { type: string }
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Unauthorized

  /api/auth/logout:
    get:
      tags: [Auth]
      summary: Log out (blacklists the current token, clears the cookie)
      responses:
        "200":
          description: Logged out

  /api/auth/users/me/addresses:
    get:
      tags: [Auth]
      summary: List the current user's saved addresses
      responses:
        "200":
          description: Address list
    post:
      tags: [Auth]
      summary: Add a saved address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Address" }
      responses:
        "201":
          description: Address added

  /api/auth/users/me/addresses/{addressId}:
    delete:
      tags: [Auth]
      summary: Delete a saved address
      parameters:
        - in: path
          name: addressId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Address removed

  /api/auth/users/me/wishlist:
    get:
      tags: [Wishlist]
      summary: Get the current user's wishlist (product IDs)
      responses:
        "200":
          description: Wishlist

  /api/auth/users/me/wishlist/{productId}:
    post:
      tags: [Wishlist]
      summary: Add a product to the wishlist
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Added
    delete:
      tags: [Wishlist]
      summary: Remove a product from the wishlist
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed

  /api/products:
    get:
      tags: [Products]
      summary: List products
      security: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: number }
        - in: query
          name: maxPrice
          schema: { type: number }
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, price_asc, price_desc, rating_desc]
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: limit
          schema: { type: number, maximum: 20 }
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
    post:
      tags: [Products]
      summary: Create a product (seller/admin only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                price: { type: number }
                stock: { type: number }
                category: { type: string }
                images:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Product created
        "403":
          description: Forbidden - requires seller or admin role

  /api/products/categories:
    get:
      tags: [Products]
      summary: List distinct product categories
      security: []
      responses:
        "200":
          description: Category list

  /api/products/seller:
    get:
      tags: [Products]
      summary: List the current seller's own products
      responses:
        "200":
          description: Product list

  /api/products/pricing/recalculate:
    post:
      tags: [Pricing]
      summary: Manually trigger the dynamic pricing rules engine (seller/admin)
      description: >
        Sellers recalculate only their own products; admins recalculate every
        product. Also runs automatically once an hour via a cron job.
      responses:
        "200":
          description: Recalculation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string }
                        title: { type: string }
                        newPrice: { type: number }
                        reason: { type: string }
                        demandScore: { type: number }

  /api/products/{id}/price-history:
    get:
      tags: [Pricing]
      summary: Get a product's price change history (last 50 entries, newest first)
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PriceHistoryEntry" }

  /api/products/{id}/competitor-price:
    patch:
      tags: [Pricing]
      summary: Set a product's competitor price (seller-owned only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competitorPrice]
              properties:
                competitorPrice: { type: number }
      responses:
        "200":
          description: Competitor price updated

  /api/products/{id}:
    get:
      tags: [Products]
      summary: Get a product by ID
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          description: Not found
    patch:
      tags: [Products]
      summary: Update a product, optionally replacing its images (seller only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                price: { type: number }
                stock: { type: number }
                category: { type: string }
                images:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Product updated
    delete:
      tags: [Products]
      summary: Delete a product (seller only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product deleted

  /api/products/{id}/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for a product
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Review list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Review" }
    post:
      tags: [Reviews]
      summary: Add or update the current user's review for a product
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: number, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "200":
          description: Review saved, product avgRating/reviewCount recomputed

  /api/cart:
    get:
      tags: [Cart]
      summary: Get the current user's cart
      responses:
        "200":
          description: Cart

  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: string }
                quantity: { type: number }
      responses:
        "201":
          description: Item added

  /api/cart/getitems:
    get:
      tags: [Cart]
      summary: Get the current user's cart items
      responses:
        "200":
          description: Cart items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CartItem" }

  /api/cart/updatecart/{id}:
    patch:
      tags: [Cart]
      summary: Update a cart item's quantity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: number }
      responses:
        "200":
          description: Item updated

  /api/cart/deletecartitem/{id}:
    delete:
      tags: [Cart]
      summary: Remove an item from the cart
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Item removed

  /api/orders:
    post:
      tags: [Orders]
      summary: Create an order from the current cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress]
              properties:
                shippingAddress: { $ref: "#/components/schemas/Address" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /api/orders/me:
    get:
      tags: [Orders]
      summary: List the current user's orders
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /api/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order cancelled

  /api/orders/{id}/address:
    patch:
      tags: [Orders]
      summary: Update an order's shipping address
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingAddress: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: Address updated

  /api/orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Advance an order's fulfillment status (seller only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [CONFIRMED, SHIPPED, DELIVERED]
      responses:
        "200":
          description: Status updated
        "403":
          description: Forbidden - requires seller role

  /api/payments/create/{orderId}:
    post:
      tags: [Payments]
      summary: Create a Razorpay payment for an order
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Razorpay order created

  /api/payments/verify:
    post:
      tags: [Payments]
      summary: Verify a Razorpay payment signature and mark it paid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                razorpay_order_id: { type: string }
                razorpay_payment_id: { type: string }
                razorpay_signature: { type: string }
      responses:
        "200":
          description: Payment verified

  /api/seller/dashboard/metrics:
    get:
      tags: [Seller Dashboard]
      summary: Get the current seller's sales metrics
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  sales: { type: number }
                  revenue: { type: number }

  /api/seller/dashboard/orders:
    get:
      tags: [Seller Dashboard]
      summary: List orders containing the current seller's products
      responses:
        "200":
          description: Order list

  /api/seller/dashboard/products:
    get:
      tags: [Seller Dashboard]
      summary: List the current seller's products (dashboard copy)
      responses:
        "200":
          description: Product list
