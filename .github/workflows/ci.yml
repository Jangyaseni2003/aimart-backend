name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - AUTH
          - PRODUCT
          - CART
          - ORDER
          - PAYMENT
          - AI-BUDDY
          - NOTIFICATION
          - SELLER-DASHBOARD
          - GATEWAY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci
      - name: Syntax-check every source file
        working-directory: ${{ matrix.service }}
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  test-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AUTH/package-lock.json
      - name: Install dependencies
        working-directory: AUTH
        run: npm ci
      - name: Run tests
        working-directory: AUTH
        run: npm test
